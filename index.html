<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر گزارش کار</title>
<script src="xlsx.min.js"></script>
<meta name="theme-color" content="#2c5282">
<style>
:root{--bg:#f3efe3;--card:#fdfbf4;--in:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#cfc9b8;--pr:#2c5282;--gr:#2f855a;--dn:#c53030;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2328;--in:#272d34;--tx:#e8eaed;--mut:#9aa3ad;--bd:#3a424c;--pr:#4a78b5;--gr:#38a169;--dn:#f56565}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Vazirmatn",sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--pr);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;font-size:19px}
.bar{display:flex;gap:10px;padding:12px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
.bar button{flex:1;font:inherit;font-size:15px;padding:13px 4px;border:0;border-radius:10px;color:#fff;background:var(--pr)}
.bar .g{background:var(--gr)}.bar .o{background:#b7791f}
.w{max-width:600px;margin:0 auto;padding:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
select,input,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx)}
textarea{resize:none;overflow:hidden;min-height:46px;line-height:1.7}
.d3{display:grid;grid-template-columns:1.1fr 1.4fr .9fr 1.3fr;gap:5px}
.rw{border-top:2px dashed var(--bd);margin-top:14px;padding-top:6px}
.rh{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:17px;margin-top:6px}
.x{border:0;background:var(--dn);color:#fff;border-radius:8px;width:40px;height:34px;font-size:18px}
.p{display:flex;gap:6px;margin-bottom:6px}.p input{flex:1}
.p button{flex:0 0 42px;border:1px solid var(--bd);background:var(--in);color:var(--dn);border-radius:10px;font-size:20px}
.add{font:inherit;border:1px dashed var(--pr);background:none;color:var(--pr);border-radius:10px;padding:9px 12px;font-size:14px}
.big{font:inherit;font-size:16px;border:0;border-radius:10px;background:var(--pr);color:#fff;padding:13px;width:100%;margin-top:14px}
.note{font-size:12px;color:var(--mut);text-align:center;padding:4px 12px 18px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px;font-size:14px;line-height:1.9}
.it small{color:var(--mut)}.it hr{border:0;border-top:1px dashed var(--bd)}
.it .b{display:flex;gap:8px;margin-top:6px}.it .b button{flex:1;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--in);color:var(--tx)}
.it .b .rm{color:var(--dn)}
.wd{background:var(--pr);color:#fff;border-radius:10px;padding:10px 2px;text-align:center;font-size:15px;font-weight:bold;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.d3 select{padding:10px 4px;font-size:15px}
.wop{display:grid;grid-template-columns:1.2fr 1fr 14px .8fr;gap:5px;align-items:center;direction:rtl;text-align:center}.wop select,.wop input{padding:10px 4px;font-size:15px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{font:inherit;font-size:13px;padding:7px 11px;border-radius:20px;border:1px solid var(--pr);background:none;color:var(--pr)}.chip.on{background:var(--pr);color:#fff}
.mw{display:flex;gap:6px;align-items:flex-start}.mw>:first-child{flex:1;min-width:0}
.mic{flex:0 0 46px;height:46px;border:0;border-radius:10px;background:#718096;color:#fff;font-size:20px}.mic.on{background:var(--dn);animation:pl 1s infinite}@keyframes pl{50%{opacity:.5}}
.tb{width:100%;font:inherit;font-size:20px;font-weight:bold;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--pr);letter-spacing:1px}.tb.empty{font-size:15px;font-weight:normal;color:var(--mut)}
.ov{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:600px;margin:0 auto;border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.ttl{text-align:center;font-weight:bold;margin-bottom:6px}.lb{display:flex;justify-content:center;gap:50px;color:var(--mut);font-size:13px}.lb span{width:90px;text-align:center}
.wr{position:relative;display:flex;justify-content:center;align-items:center;gap:10px;direction:ltr}.wr b{font-size:26px}
.wh{height:220px;width:90px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:88px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}.wh::-webkit-scrollbar{display:none}
.wh div{height:44px;line-height:44px;text-align:center;font-size:24px;scroll-snap-align:center}
.band{position:absolute;left:12%;right:12%;top:88px;height:44px;border-top:2px solid var(--pr);border-bottom:2px solid var(--pr);background:#4a78b51a;pointer-events:none;border-radius:6px}
.r3{display:flex;gap:8px;margin-top:12px}.r3 button{flex:1;font:inherit;padding:12px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--in);color:var(--tx)}.r3 .ok{background:var(--pr);color:#fff;border:0;flex:1.5}
#hv{display:none}

:root{--ink:#2b2b2b;--rule:#d5dbe8;--tint:#eaf0f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#8b95a1;--rule:#2a3139;--tint:#222a33}}
body{background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
.c{border:2px solid var(--ink);border-radius:6px;background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px)}
.ftl{text-align:center;font-weight:bold;font-size:18px;letter-spacing:1px;border-bottom:2px solid var(--ink);margin:-4px -4px 8px;padding-bottom:6px;background:var(--card)}
.rw{border:2px solid var(--ink);border-radius:6px;background:var(--card);padding:0 8px 8px;margin-top:14px}
.rh{background:var(--tint);margin:0 -8px 4px;padding:6px 8px;border-bottom:2px solid var(--ink);border-radius:4px 4px 0 0;margin-top:0}
.sg{display:flex;flex-direction:column;gap:4px;margin-top:4px}.sg:empty{display:none}
.sg button{font:inherit;font-size:14px;text-align:right;padding:8px 10px;border:1px dashed var(--pr);border-radius:8px;background:var(--in);color:var(--tx)}
.sg small{color:var(--mut);font-size:11px;margin-right:6px}
</style>
</head>
<body>
<header>📒 دفتر گزارش کار <small id="st" style="font-size:12px;opacity:.8"></small> <small id="ver" style="font-size:11px;opacity:.7"></small></header>
<div class="bar">
<button id="nw">+ گزارش جدید</button>
<button class="g" id="shr">📤 ارسال به گروه</button>
<button class="o" id="hb">📖 دفتر</button>
</div>

<div class="w" id="fv">
<div class="c">
<div class="ftl">گزارش روزانه</div>
<div class="g2">
<div><label>واحد</label><select id="unit"><option>برق</option><option>مکانیک</option><option>سایر</option></select></div>
<div style="grid-column:1/-1;order:-1"><label>تاریخ شمسی</label><div class="d3"><select id="y"></select><select id="m"></select><select id="d"></select><div class="wd" id="wd"></div></div></div>
<div><label>روز / شب</label><select id="dn"><option>روز</option><option>شب</option><option>روزکار (ثابت)</option></select></div>
<div><label>شیفت</label><select id="sh"><option>A</option><option>B</option><option>C</option><option value="">—</option></select></div>
</div>
<label>سرشیفت</label><div class="mw"><input id="head" list="names"><button type="button" class="mic">🎤</button></div>
<label>پرسنل نوبتکار</label><div class="mw"><textarea id="crew" rows="1"></textarea><button type="button" class="mic">🎤</button></div>
<label>مرخصی</label><div class="mw"><textarea id="leave" rows="1"></textarea><button type="button" class="mic">🎤</button></div>
<div id="rows"></div>
<div style="margin-top:12px"><button class="add" id="ar" type="button">+ ردیف</button></div>
<button class="big" id="save">💾 ذخیره در دفتر</button>
</div>
<div class="note">گزارش روی گوشی ذخیره می‌شود و بدون اینترنت هم کار می‌کند.</div>
</div>

<div class="w" id="hv">
<button class="big" style="margin:0 0 12px;background:var(--gr)" id="xl">⬇️ دانلود اکسل همه گزارش‌ها</button>
<div id="list"></div>
</div>
<div class="ov" id="pk"><div class="sheet"><div class="ttl" id="pkt">انتخاب ساعت</div><div class="lb"><span>ساعت</span><span>دقیقه</span></div><div class="wr"><div class="wh" id="wh"></div><b>:</b><div class="wh" id="wm"></div><div class="band"></div></div><div class="r3"><button id="pc">لغو</button><button id="pn">اکنون</button><button id="pd">پاک</button><button id="po" class="ok">تایید</button></div></div></div>
<datalist id="names"></datalist><datalist id="cds"></datalist>

<script>
const $=id=>document.getElementById(id);
const MON=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
let DB=[],curId=null;
try{DB=JSON.parse(localStorage.getItem("rep2")||"[]")}catch(e){}
const persist=()=>{try{localStorage.setItem("rep2",JSON.stringify(DB))}catch(e){}};
const esc=s=>String(s).replace(/[&<]/g,c=>c=="&"?"&amp;":"&lt;");
const fill=(el,a,s)=>{el.innerHTML=a.map(([v,l])=>`<option value="${v}"${v==s?" selected":""}>${l}</option>`).join("")};
const grow=t=>{t.style.height="auto";t.style.height=Math.max(46,t.scrollHeight+2)+"px"};
document.addEventListener("input",e=>{if(e.target.tagName=="TEXTAREA")grow(e.target)});

// Jalali date
const T={};new Intl.DateTimeFormat("en-u-ca-persian-nu-latn",{year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date()).forEach(p=>T[p.type]=+p.value);
const p2=n=>String(n).padStart(2,"0");
fill($("y"),Array.from({length:7},(_,i)=>[T.year-3+i,T.year-3+i]),T.year);
fill($("m"),MON.map((n,i)=>[i+1,n]),T.month);
function days(k){const m=+$("m").value,n=m<=6?31:30;fill($("d"),Array.from({length:n},(_,i)=>[i+1,i+1]),Math.min(k||+$("d").value||T.day,n));wd()}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+(365*jy)+(~~(jy/33))*8+~~(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);let gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}let gd=days+1;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;while(gm<13&&gd>s[gm])gd-=s[gm++];return[gy,gm,gd]}
const WD=["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];
function wdName(){const[g,m,d]=j2g(+$("y").value,+$("m").value,+$("d").value);return WD[new Date(g,m-1,d).getDay()]}
function wd(){$("wd").textContent=wdName()}
$("m").onchange=()=>days();$("y").onchange=$("d").onchange=wd;days(T.day);
const dateStr=()=>`${$("y").value}/${p2($("m").value)}/${p2($("d").value)}`;

// times every 15 min, shown as 0730
const TM=[["","—"]];for(let h=0;h<24;h++)for(const m of[0,15,30,45]){const v=p2(h)+p2(m);TM.push([v,v])}

// rows
function codeRow(box,v=""){const r=document.createElement("div");r.className="p";
 r.innerHTML='<input inputmode="numeric" list="cds" placeholder="کد پرسنل"><button type="button">−</button>';
 r.firstChild.value=v;r.lastChild.onclick=()=>{box.children.length>1?r.remove():r.firstChild.value=""};box.appendChild(r)}
function addRow(o={}){
 const r=document.createElement("div");r.className="rw";
 r.innerHTML=`<div class="rh"><button type="button" class="x">✕</button><span class="n"></span></div>
 <label>شرح کارهای انجام شده</label><div class="mw"><textarea class="desc" rows="1"></textarea><button type="button" class="mic">🎤</button></div><div class="sg"></div>
 <label>توضیحات / ملاحظات / شرح خرابی</label><div class="mw"><textarea class="nt" rows="1"></textarea><button type="button" class="mic">🎤</button></div>
 <label>کد پرسنل</label><div class="cb"></div><button type="button" class="add ac">+ کد پرسنل</button>
 <div class="g2"><div><label>ساعت شروع</label><button type="button" class="tb t1"></button></div><div><label>ساعت پایان</label><button type="button" class="tb t2"></button></div></div>
 <label>توقف</label><input class="stp" placeholder=""><div class="chips"><button type="button" class="chip">pm</button><button type="button" class="chip">اضطراری</button><button type="button" class="chip">تعویض کالیبر</button><button type="button" class="chip">بدون توقف</button></div>
 <label>کد دستور کار برنامه‌ریزی‌شده</label><input class="woc" type="text" dir="auto" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false">`;
 const wc=r.querySelector(".woc");wc.value=o.woc||"";
 setT(r.querySelector(".t1"),o.from||"");setT(r.querySelector(".t2"),o.to||"");
 r.querySelector(".desc").value=o.desc||"";r.querySelector(".nt").value=o.note||"";r.querySelector(".stp").value=o.stop||"";syncChips(r);
 const cb=r.querySelector(".cb");(o.codes&&o.codes.length?o.codes:[""]).forEach(c=>codeRow(cb,c));
 r.querySelector(".ac").onclick=()=>codeRow(cb);
 r.querySelector(".x").onclick=()=>{if($("rows").children.length>1){r.remove();num()}else if(confirm("پاک شود؟")){r.remove();addRow();}};
 $("rows").appendChild(r);num();r.querySelectorAll("textarea").forEach(grow)}
function num(){[...$("rows").children].forEach((r,i)=>r.querySelector(".n").textContent="ردیف "+(i+1))}
$("ar").onclick=()=>{addRow();$("rows").lastChild.scrollIntoView({behavior:"smooth"})};

function collect(){
 return{id:curId||Date.now(),date:dateStr(),wd:wdName(),unit:$("unit").value,dn:$("dn").value,shift:$("sh").value,head:$("head").value.trim(),crew:$("crew").value.trim(),leave:$("leave").value.trim(),
 rows:[...$("rows").children].map(r=>({desc:r.querySelector(".desc").value.trim(),codes:[...r.querySelectorAll(".cb input")].map(i=>i.value.trim()).filter(Boolean),
 from:r.querySelector(".t1").dataset.v||"",to:r.querySelector(".t2").dataset.v||"",stop:r.querySelector(".stp").value,woc:r.querySelector(".woc").value.trim(),note:r.querySelector(".nt").value.trim()}))
 .filter(x=>x.desc||x.codes.length||x.note||x.woc)}}
function reset(rep){
 curId=rep?rep.id:null;$("rows").innerHTML="";
 if(rep){const [a,b,c]=rep.date.split("/");$("y").value=+a;$("m").value=+b;days(+c);$("unit").value=rep.unit;$("dn").value=rep.dn;$("sh").value=rep.shift;
  $("head").value=rep.head;$("crew").value=rep.crew;$("leave").value=rep.leave;rep.rows.forEach(addRow)}
 else{$("y").value=T.year;$("m").value=T.month;days(T.day);$("head").value=$("crew").value=$("leave").value="";addRow()}
 grow($("crew"));grow($("leave"))}
function save(quiet){
 const r=collect();if(!r.rows.length){alert("حداقل یک ردیف گزارش پر کنید");return null}
 const i=DB.findIndex(x=>x.id==r.id);i>=0?DB[i]=r:DB.push(r);curId=r.id;persist();hints();
 if(!quiet)alert("ذخیره شد ✓");return r}
function hints(){const n=new Set(),c=new Set();DB.forEach(r=>{r.head&&n.add(r.head);r.rows.forEach(x=>x.codes.forEach(k=>c.add(k)))});
 $("names").innerHTML=[...n].map(v=>`<option value="${esc(v)}">`).join("");$("cds").innerHTML=[...c].map(v=>`<option value="${esc(v)}">`).join("")}

// export
function csv(list){
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const h=["تاریخ","واحد","روز/شب","شیفت","سرشیفت","نوبتکار","مرخصی","ردیف","شرح کار","کد پرسنل","شروع","پایان","توقف","توضیحات"];
 const L=[h];list.forEach(r=>r.rows.forEach((x,i)=>L.push([(r.wd||"")+" "+r.date,r.unit,r.dn,r.shift,r.head,r.crew,r.leave,i+1,x.desc,x.codes.join(" "),x.from,x.to,x.stop,x.note])));
 return "\ufeff"+L.map(l=>l.map(q).join(",")).join("\r\n")}
function dl(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
// متن کنار فایل اکسل (مثل عکس): عنوان، شیفت، سرشیفت، نوبتکار، مرخصی — بدون ردیف‌ها
function cap(r){
 const t="📒 گزارش کار "+[r.wd,r.date].filter(Boolean).join(" ")+[r.unit,r.dn,r.shift&&"شیفت "+r.shift].filter(Boolean).map(v=>" | "+v).join("");
 return [t,r.head&&"سرشیفت: "+r.head,r.crew&&"نوبتکار: "+r.crew,r.leave&&"مرخصی: "+r.leave].filter(Boolean).join("\n")}
// ===== خروجی اکسل با فرمت شیت «ورود» (ستون‌های A تا M) =====
const XL_HEAD=["تاریخ","عنوان کار","نوع","تجهیز","مجری","شروع","پایان","نفر ۱","نفر ۲","نفر ۳","نفر ۴","نفر ۵","شرح عملیات","نوع توقف","کد دستور کار برنامه‌ریزی‌شده"];
const UEN={"برق":"barq","مکانیک":"mekanik","سایر":"sayer"};
const DNEN={"روز":"roz","شب":"shab","روزکار (ثابت)":"rozkar"};
const MONEN=["farvardin","ordibehesht","khordad","tir","mordad","shahrivar","mehr","aban","azar","dey","bahman","esfand"];
// مجری مثل نمونه: برق/مکانیک از خود واحد؛ در غیر این صورت از اولین کد پرسنل (۱xx برق، ۲xx مکانیک)
const mojri=(r,c)=>r.unit=="برق"||r.unit=="مکانیک"?r.unit:(c&&String(c[0]||"")[0]=="1"?"برق":c&&String(c[0]||"")[0]=="2"?"مکانیک":"");
const p2e=s=>String(s).replace(/[۰-۹]/g,x=>"۰۱۲۳۴۵۶۷۸۹".indexOf(x)).replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x));
const hhmm=v=>v&&String(v).length==4?v.slice(0,2)+":"+v.slice(2):"";
const isNative=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const plug=n=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins[n];
function buildX(list){
 const aoa=[XL_HEAD];let over=0;
 list.forEach(r=>r.rows.forEach(x=>{
  let all=x.codes.map(k=>p2e(k).trim()).filter(Boolean).map(k=>/^\d+$/.test(k)?Number(k):k);
  let c=all.slice(0,5);if(all.length>5)over++;
  while(c.length<5)c.push(null);
  // ستون‌ها: A تاریخ | B عنوان کار (شرح کار) | E مجری | F,G ساعت | H..L نفرات | M شرح عملیات (توضیحات/شرح خرابی) | N نوع توقف | O کد دستور کار (آزاد، همان‌طور که تایپ شده)
  aoa.push([r.date,x.desc||"",null,null,mojri(r,c)||null,hhmm(x.from)||null,hhmm(x.to)||null,...c,x.note||null,x.stop||null,String(x.woc||"").trim()||null]);
 }));
 const ws=XLSX.utils.aoa_to_sheet(aoa);
 ws["!cols"]=[{wch:12.9},{wch:75.9},{wch:7.9},{wch:30.9},{wch:10.9},{wch:8.9},{wch:8.9},{wch:7.9},{wch:7.9},{wch:7.9},{wch:7.9},{wch:4.5},{wch:26.9},{wch:27.6},{wch:18.9}];
 const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,"ورود");
 return{wb,over,n:aoa.length-1};
}
const STOPS=["pm","اضطراری","تعویض کالیبر","بدون توقف"];
function XW(wb,type){
 const u=XLSX.write(wb,{bookType:"xlsx",type:"array"});
 const z=XLSX.CFB.read(new Uint8Array(u),{type:"array"});
 const i=z.FullPaths.findIndex(p=>/worksheets\/sheet1\.xml$/.test(p));
 let x=new TextDecoder().decode(z.FileIndex[i].content);
 const dv='<dataValidations count="1"><dataValidation type="list" allowBlank="1" showErrorMessage="0" sqref="N2:N2000"><formula1>"'+STOPS.join(",")+'"</formula1></dataValidation></dataValidations>';
 x=x.replace("</sheetData>","</sheetData>"+dv);
 z.FileIndex[i].content=new TextEncoder().encode(x);z.FileIndex[i].size=z.FileIndex[i].content.length;
 const out=XLSX.CFB.write(z,{type:"array",fileType:"zip"});
 if(type=="base64"){let b="";const a=new Uint8Array(out);for(let k=0;k<a.length;k+=8192)b+=String.fromCharCode.apply(null,a.subarray(k,k+8192));return btoa(b)}
 return out}
function XD(wb,name){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([XW(wb,"array")],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const fname=r=>{const q=r.date.split("/");return `${UEN[r.unit]||"report"}_${+q[2]}${MONEN[(+q[1])-1]||q[1]}_${DNEN[r.dn]||"roz"}${r.shift?"_"+r.shift:""}.xlsx`};
async function shareX(wb,name,text){
 if(isNative()){
  const b64=XW(wb,"base64");
  const w=await plug("Filesystem").writeFile({path:name,data:b64,directory:"CACHE"});
  await plug("Share").share({title:name,text:text||undefined,url:w.uri,dialogTitle:"ارسال به گروه"});
  return true;
 }
 const f=new File([XW(wb,"array")],name,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
 const ab=e=>e&&(e.name==="AbortError"||/cancel/i.test(String(e.message||e)));
 if(navigator.canShare&&navigator.canShare({files:[f]})){
  try{await navigator.share(text?{files:[f],title:name,text}:{files:[f],title:name});return true}
  catch(e){if(ab(e))throw e;
   try{await navigator.share({files:[f],title:name});return true}catch(e2){if(ab(e2))throw e2}}
 }
 let cp=false;if(text){try{await navigator.clipboard.writeText(text);cp=true}catch(_){}}
 XD(wb,name);alert("اشتراک‌گذاری مستقیم در این مرورگر/آدرس کار نکرد؛ فایل دانلود شد."+(cp?"\nمتن گزارش (شیفت، سرشیفت، …) کپی شد؛ در پیام‌رسان paste کنید.":"")+"\n(ارسال مستقیم فقط در Chrome گوشی و روی آدرس https کار می‌کند؛ در APK همیشه کار می‌کند.)");return false;
}
async function saveX(list,name){
 const{wb,over,n}=buildX(list);
 if(!n){alert("ردیفی برای ذخیره نیست");return}
 if(over)alert("بعضی ردیف‌ها بیش از ۵ نفر دارند؛ فقط ۵ نفر اول در اکسل ثبت می‌شود");
 if(isNative()){
  try{const F=plug("Filesystem");try{await F.requestPermissions()}catch(e){}
   await F.writeFile({path:name,data:XW(wb,"base64"),directory:"DOCUMENTS",recursive:true});
   alert("ذخیره شد در پوشه Documents گوشی:\n"+name);return}catch(e){}
  try{await shareX(wb,name)}catch(e){alert("ذخیره نشد: "+String(e&&e.message||e))}
  return;
 }
 XD(wb,name);
}
$("xl").onclick=()=>DB.length?saveX(DB,"gozaresh_all.xlsx"):alert("گزارشی ثبت نشده");
$("shr").onclick=async()=>{
 const r=save(true);if(!r)return;
 const{wb,over,n}=buildX([r]);
 if(!n){alert("ردیفی برای ارسال نیست");return}
 if(over)alert("بعضی ردیف‌ها بیش از ۵ نفر دارند؛ فقط ۵ نفر اول در اکسل ثبت می‌شود");
 try{await shareX(wb,fname(r),cap(r))}catch(e){const m=String(e&&e.message||e);if((e&&e.name==="AbortError")||/cancel/i.test(m))return;alert("خطا در ارسال: "+m)}
};

// ledger
function show(h){$("fv").style.display=h?"none":"";$("hv").style.display=h?"block":"none";$("hb").textContent=h?"✏️ فرم":"📖 دفتر";if(h)render();scrollTo(0,0)}
$("hb").onclick=()=>show($("hv").style.display!="block");
function render(){
 $("list").innerHTML=DB.slice().reverse().map(r=>`<div class="it"><b>${r.wd||""} ${r.date}</b> — ${esc(r.unit)} | ${r.dn} | شیفت ${r.shift}<br><small>سرشیفت: ${esc(r.head)} | نوبتکار: ${esc(r.crew)}${r.leave?" | مرخصی: "+esc(r.leave):""}</small>
 ${r.rows.map((x,i)=>`<hr>${i+1}) ${esc(x.desc).replace(/\n/g,"<br>")}<br><small>کد: ${esc(x.codes.join(" "))} | ${x.from||"-"} تا ${x.to||"-"}${x.stop?" | "+x.stop:""}${x.woc?" | دستور کار: "+esc(x.woc):""}${x.note?"<br>"+esc(x.note):""}</small>`).join("")}
 <div class="b"><button data-e="${r.id}">ویرایش</button><button data-x="${r.id}">اکسل</button><button class="rm" data-r="${r.id}">حذف</button></div></div>`).join("")||'<div class="note">گزارشی ثبت نشده</div>';
 $("list").querySelectorAll("button").forEach(b=>b.onclick=()=>{const D=b.dataset,id=D.e||D.x||D.r,r=DB.find(x=>x.id==id);
  if(D.e){reset(r);show(false)}else if(D.x)saveX([r],fname(r));else if(confirm("حذف شود؟")){DB=DB.filter(x=>x.id!=id);persist();render()}})}

$("save").onclick=()=>save();
$("nw").onclick=()=>{if(confirm("فرم جدید باز شود؟ (گزارش ذخیره‌نشده پاک می‌شود)")){reset();show(false)}};
const net=()=>$("st").textContent=navigator.onLine?"● آنلاین":"● آفلاین";addEventListener("online",net);addEventListener("offline",net);net();
// time wheel picker
function setT(b,v){b.dataset.v=v;b.textContent=v?v.slice(0,2)+":"+v.slice(2):"⏱ انتخاب";b.classList.toggle("empty",!v)}
const WH=$("wh"),WM=$("wm");let PK=null;
WH.innerHTML=Array.from({length:24},(_,i)=>`<div>${p2(i)}</div>`).join("");
WM.innerHTML=Array.from({length:60},(_,i)=>`<div>${p2(i)}</div>`).join("");
function openPk(b){PK=b;let v=b.dataset.v;
 if(!v&&b.classList.contains("t2")){const s=b.closest(".rw").querySelector(".t1").dataset.v;if(s)v=s}
 if(!v)v="0800";$("pkt").textContent=b.classList.contains("t1")?"ساعت شروع":"ساعت پایان";
 $("pk").classList.add("on");WH.scrollTop=+v.slice(0,2)*44;WM.scrollTop=+v.slice(2)*44}
const pick=()=>p2(Math.round(WH.scrollTop/44))+p2(Math.round(WM.scrollTop/44));
document.addEventListener("click",e=>{const b=e.target.closest(".tb");if(b)openPk(b)});
$("po").onclick=()=>{setT(PK,pick());$("pk").classList.remove("on")};
$("pc").onclick=()=>$("pk").classList.remove("on");
$("pd").onclick=()=>{setT(PK,"");$("pk").classList.remove("on")};
$("pn").onclick=()=>{const n=new Date();WH.scrollTo({top:n.getHours()*44,behavior:"smooth"});WM.scrollTo({top:n.getMinutes()*44,behavior:"smooth"})};
$("pk").onclick=e=>{if(e.target.id=="pk")$("pk").classList.remove("on")};
// voice input
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
document.addEventListener("click",e=>{const b=e.target.closest(".micold");if(!b)return;
 if(!SR)return alert("این مرورگر تشخیص گفتار ندارد؛ از Chrome استفاده کنید");
 if(rec){rec.stop();return}
 const f=b.parentElement.querySelector("textarea,input");rec=new SR();rec.lang="fa-IR";rec.interimResults=false;b.classList.add("on");
 rec.onresult=ev=>{const t=ev.results[0][0].transcript;f.value=(f.value?f.value+" ":"")+t;if(f.tagName=="TEXTAREA")grow(f)};
 rec.onend=rec.onerror=()=>{b.classList.remove("on");rec=null};
 try{rec.start()}catch(_){rec=null;b.classList.remove("on")}});
// stop chips
function syncChips(rw){const v=rw.querySelector(".stp").value.trim();rw.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.textContent==v))}
document.addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;const rw=c.closest(".rw"),i=rw.querySelector(".stp");i.value=i.value.trim()==c.textContent?"":c.textContent;syncChips(rw)});
document.addEventListener("input",e=>{if(e.target.classList.contains("stp"))syncChips(e.target.closest(".rw"))});
// voice v2
let REC=null,RB=null;
const ERR={"not-allowed":"اجازه میکروفون داده نشده. در Chrome روی 🔒 کنار آدرس بزنید، Permissions و بعد Microphone را Allow کنید.","service-not-allowed":"سرویس تشخیص صدا در این مرورگر مجاز نیست.","no-speech":"صدایی شنیده نشد؛ نزدیک‌تر صحبت کنید و دوباره بزنید.","audio-capture":"میکروفون پیدا نشد.","network":"برای تشخیص صدا اینترنت لازم است."};
function stopMic(){if(REC){try{REC.abort()}catch(_){}}REC=null;if(RB)RB.classList.remove("on");RB=null}
document.addEventListener("click",e=>{const b=e.target.closest(".mic");if(!b)return;
 if(RB===b){stopMic();return}
 stopMic();
 const f=b.parentElement.querySelector("textarea,input");
 if(isNative()){nativeMic(b,f);return}
 if(!SR){f.focus();alert("این مرورگر تشخیص گفتار ندارد. دکمه 🎤 روی کیبورد گوشی (تایپ صوتی) را بزنید یا از Chrome استفاده کنید.");return}
 if(!isSecureContext){alert("تشخیص صدا فقط روی آدرس https کار می‌کند.");return}
 const r=new SR();REC=r;RB=b;r.lang="fa-IR";r.continuous=false;r.interimResults=false;r.maxAlternatives=1;b.classList.add("on");
 r.onresult=ev=>{const t=[...ev.results].map(x=>x[0].transcript).join(" ").trim();if(t){f.value=(f.value?f.value+" ":"")+t;if(f.tagName=="TEXTAREA")grow(f)}};
 r.onerror=ev=>{if(ev.error!="aborted")alert((ERR[ev.error]||"خطا در میکروفون: "+ev.error)+(top!==self?"\nاین صفحه داخل پیش‌نمایش است؛ لینک را مستقیم در Chrome باز کنید.":""))};
 r.onend=()=>{if(RB===b){b.classList.remove("on");REC=null;RB=null}};
 try{r.start()}catch(err){stopMic();alert("میکروفون شروع نشد؛ دوباره بزنید.")}});
async function nativeMic(b,f){
 const SRP=plug("SpeechRecognition");
 if(!SRP){f.focus();alert("ورودی صوتی در این نسخه نیست. از میکروفون کیبورد گوشی استفاده کنید.");return}
 try{
  const a=await SRP.available();
  if(!a.available){alert("تشخیص صدا روی این گوشی نصب/فعال نیست. از میکروفون کیبورد گوشی استفاده کنید.");return}
  let p=await SRP.checkPermissions();
  if(p.speechRecognition!=="granted"){p=await SRP.requestPermissions();if(p.speechRecognition!=="granted"){alert("اجازه میکروفون داده نشد.");return}}
  b.classList.add("on");
  const r=await SRP.start({language:"fa-IR",maxResults:1,prompt:"بفرمایید",partialResults:false,popup:true});
  const t=r&&r.matches&&r.matches[0];
  if(t){f.value=(f.value?f.value+" ":"")+p2e(t);if(f.tagName=="TEXTAREA")grow(f)}
 }catch(e){const m=String(e&&e.message||e);if(!/cancel|dismiss/i.test(m))alert("میکروفون: "+m+"\nاز میکروفون کیبورد گوشی استفاده کنید.")}
 finally{b.classList.remove("on")}
}
// پیشنهاد شرح کار: با تایپ چند حرف، عبارت‌های قبلی (از گزارش‌های ذخیره‌شده) پیشنهاد می‌شود
const SEED=["چک کردن خط تولید","آچارکشی کردن تیغه گیوتین بسته‌بندی","عوض کردن شیلنگ باد درب کوره","آچارکشی کردن کوبل استند ۱۲","عوض کردن قفل زنجیر کالسکه سیخ کوره","جوشکاری شاسی کالسکه سیخ کوره"];
const nz=s=>p2e(String(s)).replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/[\u200c\u064b-\u065f]/g,"").toLowerCase();
function phrases(){const m=new Map();SEED.forEach(t=>m.set(t,0));DB.forEach(r=>r.rows.forEach(x=>{const t=(x.desc||"").trim();if(t&&t.length<120&&t.indexOf("\n")<0)m.set(t,(m.get(t)||0)+1)}));return[...m]}
function sugg(ta){
 const box=ta.closest(".rw").querySelector(".sg"),q=nz(ta.value).trim();box.innerHTML="";if(!q)return;
 const k=q.split(/\s+/);
 phrases().map(([t,c])=>({t,c,n:nz(t)})).filter(o=>o.n!==q&&k.every(w=>o.n.includes(w)))
  .sort((a,b)=>(b.n.startsWith(k[0])-a.n.startsWith(k[0]))||b.c-a.c).slice(0,6)
  .forEach(o=>{const b=document.createElement("button");b.type="button";b.textContent=o.t;
   if(o.c){const m=document.createElement("small");m.textContent="×"+o.c;b.appendChild(m)}
   b.onpointerdown=e=>{e.preventDefault();ta.value=o.t;grow(ta);box.innerHTML="";ta.focus()};box.appendChild(b)})}
document.addEventListener("input",e=>{if(e.target.classList.contains("desc"))sugg(e.target)});
document.addEventListener("focusout",e=>{const t=e.target;if(t.classList&&t.classList.contains("desc"))setTimeout(()=>{const r=t.closest(".rw");if(r)r.querySelector(".sg").innerHTML=""},250)});
const BLD="__BUILD__";if(BLD.indexOf("__")!==0)$("ver").textContent="v"+BLD;
hints();reset();
</script>
